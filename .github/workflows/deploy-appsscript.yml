name: Déployer vers Apps Script

# Se déclenche à chaque envoi (push) sur la branche principale.
# Si ton repo utilise "master" au lieu de "main", change la ligne
# ci-dessous en conséquence.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du repo
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer clasp
        run: npm install -g @google/clasp

      # Correctif : le secret est passé via une variable d'environnement
      # (CLASP_CREDENTIALS), PAS inséré directement dans la commande —
      # sinon un caractère spécial du shell présent dans le token (`$`,
      # backtick...) peut être interprété au lieu d'être écrit tel quel,
      # corrompant le fichier JSON généré (constat concret : "Expected
      # property name ... at position 4" lors du premier essai).
      # printf '%s' (au lieu de echo) écrit le contenu exact, sans
      # ajouter ou interpréter quoi que ce soit.
      - name: Restaurer les identifiants clasp (secret GitHub)
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: printf '%s' "$CLASP_CREDENTIALS" > ~/.clasprc.json

      - name: Envoyer le code vers Apps Script (clasp push)
        run: clasp push --force

      # -i <ID> pointe vers le déploiement WEB APP EXISTANT (celui dont
      # l'URL /exec est déjà configurée sur Vercel) — indispensable pour
      # que l'URL reste identique au lieu de créer un nouveau déploiement
      # à chaque fois.
      - name: Créer une nouvelle version du déploiement existant
        env:
          CLASP_DEPLOYMENT_ID: ${{ secrets.CLASP_DEPLOYMENT_ID }}
        run: clasp deploy -i "$CLASP_DEPLOYMENT_ID" -d "Déploiement automatique GitHub Actions"
